<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תצוגה מקדימה: מימוש מטבעות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-color: #E0A325; /* זהב המטבעות המעובד */
      --accent-glow: rgba(244, 184, 58, 0.15);
      --bg-gradient: linear-gradient(135deg, #F9F8F3 0%, #EFECE1 100%);
      --card-bg: #FAF6EA;
      --card-border: rgba(139, 105, 20, 0.25);
      --text-main: #2A2620;
      --text-muted: #736C62;
      --coin-img: url('./assets/coin.png');
      --paper-url: url('./assets/paper-texture.png');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Rubik', 'Outfit', system-ui, sans-serif;
      background: var(--bg-gradient);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(244, 184, 58, 0.08) 0%, transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(44, 74, 96, 0.06) 0%, transparent 55%),
        var(--paper-url);
      background-blend-mode: multiply;
      background-size: cover;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      perspective: 1200px;
      padding: 20px;
    }

    /* תיבת האוצר / כיס המטבעות העליון */
    .treasury-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 105, 20, 0.2);
      border-radius: 999px;
      padding: 10px 24px;
      margin-bottom: 28px;
      box-shadow: 0 4px 16px rgba(80, 68, 93, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      z-index: 10;
      position: relative;
      transition: transform 0.3s;
    }

    .treasury-badge:hover {
      transform: scale(1.03);
    }

    .treasury-coin-icon {
      width: 32px;
      height: 32px;
      background-image: var(--coin-img);
      background-size: contain;
      background-repeat: no-repeat;
      filter: drop-shadow(0 2px 6px rgba(184, 134, 11, 0.3));
    }

    .treasury-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .treasury-balance {
      font-size: 22px;
      font-weight: 800;
      color: #B8860B;
      font-variant-numeric: tabular-nums;
      display: inline-block;
      transition: transform 0.1s;
    }

    .treasury-balance.bump {
      transform: scale(1.2);
    }

    /* כרטיס הרכישה הראשי */
    .purchase-container {
      background-color: var(--card-bg);
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(244, 184, 58, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 90%, rgba(213, 188, 145, 0.22) 0%, transparent 60%),
        var(--paper-url);
      background-blend-mode: multiply;
      background-size: cover;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid var(--card-border);
      border-radius: 28px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        0 8px 24px rgba(80, 68, 93, 0.08),
        0 16px 40px rgba(80, 68, 93, 0.06);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }

    .purchase-container:hover {
      transform: translateY(-4px);
    }

    /* אזור מוצר/קופה */
    .product-icon-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .product-glow {
      position: absolute;
      inset: -15px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulseGlow 3s infinite ease-in-out;
      z-index: 1;
    }

    .product-icon {
      position: relative;
      width: 80px;
      height: 80px;
      background: #FAF6EA;
      background-image: var(--paper-url);
      background-blend-mode: multiply;
      border: 1.5px solid rgba(139, 105, 20, 0.35);
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      box-shadow: 0 6px 18px rgba(80, 68, 93, 0.1);
      z-index: 2;
    }

      font-size: 22px;
      font-weight: 800;
      color
